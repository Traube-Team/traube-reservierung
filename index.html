<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traube Tischreservierung</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .container { grid-template-columns: 1fr 1fr; } }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #8b0000; border-bottom: 2px solid #8b0000; padding-bottom: 10px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #8b0000; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; width: 100%; font-weight: bold; }
        button:hover { background: #a00000; }
        .error { color: red; font-weight: bold; margin-top: 10px; display: none; }
        .success { color: green; font-weight: bold; margin-top: 10px; display: none; }
        .admin-section { grid-column: 1 / -1; background: #fff3f3; border: 1px solid #deb887; }
        .res-item { padding: 10px; border-bottom: 1px solid #eee; margin-bottom: 5px; background: #fafafa; border-radius: 4px; }
        .toggle-btn { background: #555; padding: 6px 12px; font-size: 12px; width: auto; margin-right: 5px; border-radius: 4px; color: white; cursor: pointer; border: none; }
        .toggle-btn.active { background: green; }
    </style>
</head>
<body>

<div class="container">
    <div class="card admin-section">
        <h2>Traube Admin-Panel (Theke)</h2>
        <p><strong>Wochentage manuell steuern (Klicken zum Umschalten):</strong></p>
        <button class="toggle-btn" id="btn-Mon" onclick="toggleDay('Monday')">Montag (Zu)</button>
        <button class="toggle-btn" id="btn-Tue" onclick="toggleDay('Tuesday')">Dienstag (Zu)</button>
        <button class="toggle-btn" id="btn-Wed" onclick="toggleDay('Wednesday')">Mittwoch (Zu)</button>
        <button class="toggle-btn active" id="btn-Thu" onclick="toggleDay('Thursday')">Donnerstag (Offen)</button>
        <button class="toggle-btn active" id="btn-Fri" onclick="toggleDay('Friday')">Freitag (Offen)</button>
        <button class="toggle-btn" id="btn-Sat" onclick="toggleDay('Saturday')">Samstag (Zu)</button>
        <button class="toggle-btn active" id="btn-Sun" onclick="toggleDay('Sunday')">Sonntag (Offen)</button>
        
        <p style="margin-top: 15px;"><strong>Bereiche manuell steuern:</strong></p>
        <button class="toggle-btn active" id="btn-gastraum" onclick="toggleArea('Gastraum')">Gastraum (Offen)</button>
        <button class="toggle-btn active" id="btn-aussen" onclick="toggleArea('Außenbereich')">Außenbereich (Offen)</button>
        <button class="toggle-btn active" id="btn-biergarten" onclick="toggleArea('Biergarten')">Biergarten (Offen)</button>
    </div>

    <div class="card">
        <h2>Tisch reservieren</h2>
        <form id="resForm" onsubmit="handleReserve(event)">
            <label>Vorname *</label>
            <input type="text" id="vorname" required>
            <label>Nachname *</label>
            <input type="text" id="nachname" required>
            <label>Telefonnummer *</label>
            <input type="tel" id="telefon" required>
            <label>E-Mail-Adresse (Optional)</label>
            <input type="email" id="email">
            <label>Wo möchten Sie sitzen? *</label>
            <select id="bereich" onchange="updateUhrzeiten()"></select>
            <label>Wunschdatum *</label>
            <input type="date" id="datum" onchange="updateUhrzeiten()" required>
            <label>Wunsch-Uhrzeit *</label>
            <select id="uhrzeit" required></select>
            <label>Personenzahl *</label>
            <input type="number" id="personen" min="1" required>
            <label>Besondere Wünsche oder Notizen (Optional)</label>
            <textarea id="notizen" rows="3"></textarea>
            <button type="submit">Jetzt Tisch reservieren</button>
            <div id="errorMsg" class="error"></div>
            <div id="successMsg" class="success">Vielen Dank für Ihre Reservierung!</div>
        </form>
    </div>

    <div class="card">
        <h2>Reservierungskalender</h2>
        <div id="calendar"></div>
        <div id="dayListSection" style="margin-top: 20px; display: none;">
            <h3 id="selectedDateTitle" style="color: #8b0000; margin-bottom: 10px;"></h3>
            <div id="dayReservations"></div>
        </div>
    </div>
</div>

<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>
<script>
    let reservierungen = JSON.parse(localStorage.getItem('traube_res')) || [];
    let config = JSON.parse(localStorage.getItem('traube_config')) || {
        days: { Monday: false, Tuesday: false, Wednesday: false, Thursday: true, Friday: true, Saturday: false, Sunday: true },
        areas: { Gastraum: true, Außenbereich: true, Biergarten: true },
        limits: { Gastraum: 30, Außenbereich: 10, Biergarten: 20 }
    };
    let calendar;

    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'de',
            headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
            events: getCalendarEvents(),
            dateClick: function(info) { showDayList(info.dateStr); }
        });
        calendar.render();
        initForm();
        updateButtons();
    });

    function save() {
        localStorage.setItem('traube_res', JSON.stringify(reservierungen));
        localStorage.setItem('traube_config', JSON.stringify(config));
        if(calendar) { calendar.removeAllEvents(); calendar.addEventSource(getCalendarEvents()); }
    }

    function toggleDay(day) {
        config.days[day] = !config.days[day];
        updateButtons(); save(); initForm();
    }

    function toggleArea(area) {
        config.areas[area] = !config.areas[area];
        updateButtons(); save(); initForm();
    }

    function updateButtons() {
        const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
        const deDays = {Monday:'Montag',Tuesday:'Dienstag',Wednesday:'Mittwoch',Thursday:'Donnerstag',Friday:'Freitag',Saturday:'Samstag',Sunday:'Sonntag'};
        days.forEach(d => {
            const btn = document.getElementById('btn-' + d.substring(0,3));
            if(config.days[d]) { btn.classList.add('active'); btn.innerText = deDays[d] + ' (Offen)'; }
            else { btn.classList.remove('active'); btn.innerText = deDays[d] + ' (Zu)'; }
        });
        ['Gastraum', 'Außenbereich', 'Biergarten'].forEach(a => {
            const id = a === 'Außenbereich' ? 'aussen' : a.toLowerCase();
            const btn = document.getElementById('btn-' + id);
            if(config.areas[a]) { btn.classList.add('active'); btn.innerText = `${a} (Offen)`; }
            else { btn.classList.remove('active'); btn.innerText = `${a} (Zu)`; }
        });
    }

    function initForm() {
        const bSelect = document.getElementById('bereich');
        bSelect.innerHTML = '';
        ['Gastraum', 'Außenbereich', 'Biergarten'].forEach(a => {
            if(config.areas[a]) {
                let opt = document.createElement('option');
                opt.value = a; opt.innerText = `${a} (max. ${config.limits[a]} Pers.)`;
                bSelect.appendChild(opt);
            }
        });
        updateUhrzeiten();
    }

    function updateUhrzeiten() {
        const dateVal = document.getElementById('datum').value;
        const uSelect = document.getElementById('uhrzeit');
        uSelect.innerHTML = '';
        if(!dateVal) return;

        const date = new Date(dateVal);
        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const wochentag = dayNames[date.getDay()];

        if(!config.days[wochentag]) {
            let opt = document.createElement('option');
            opt.innerText = '❌ An diesem Tag geschlossen';
            uSelect.appendChild(opt); return;
        }

        let zeiten = [];
        if(wochentag === 'Sunday') {
            zeiten.push('11:00','11:15','11:30','11:45','12:00','12:15','12:30','12:45','13:00');
        }
        zeiten.push('17:00','17:15','17:30','17:45','18:00','18:15','18:30','18:45','19:00','19:15','19:30');

        zeiten.forEach(z => {
            let opt = document.createElement('option');
            opt.value = z; opt.innerText = z + ' Uhr';
            uSelect.appendChild(opt);
        });
    }

    function getCalendarEvents() {
        let blocks = {};
        reservierungen.forEach(r => {
            let key = `${r.datum}_${r.bereich}_${r.uhrzeit}`;
            blocks[key] = (blocks[key] || 0) + parseInt(r.personen);
        });
        let events = [];
        reservierungen.forEach((r, index) => {
            let key = `${r.datum}_${r.bereich}_${r.uhrzeit}`;
            let sum = blocks[key];
            let max = config.limits[r.bereich];
            let isOk = sum <= max;
            events.push({
                title: `${r.uhrzeit} - ${r.personen}P - ${r.nachname}`,
                start: r.datum,
                color: isOk ? '#28a745' : '#dc3545',
                extendedProps: { index: index }
            });
        });
return events;}function showDayList(dateStr) {const section = document.getElementById('dayListSection');const title = document.getElementById('selectedDateTitle');const list = document.getElementById('dayReservations');let d = new Date(dateStr);title.innerText = Reservierungen am ${d.toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}:;list.innerHTML = '';let tagRes = reservierungen.filter(r => r.datum === dateStr);tagRes.sort((a,b) => a.uhrzeit.localeCompare(b.uhrzeit));if(tagRes.length === 0) {list.innerHTML = 'Keine Reservierungen für diesen Tag vorhanden.';} else {tagRes.forEach(r => {let div = document.createElement('div');div.className = 'res-item';div.innerHTML = <strong>${r.uhrzeit} Uhr</strong> - ${r.personen} Personen (${r.bereich})<br>Gast: ${r.nachname}, ${r.vorname} | Tel: ${r.telefon}<br>${r.notizen ? '<em>Notiz: ' + r.notizen + '</em>' : ''};list.appendChild(div);});}section.style.display = 'block';}function handleReserve(e) {e.preventDefault();const err = document.getElementById('errorMsg');const succ = document.getElementById('successMsg');err.style.display = 'none'; succ.style.display = 'none';const datum = document.getElementById('datum').value;const uhrzeit = document.getElementById('uhrzeit').value;const bereich = document.getElementById('bereich').value;const personen = parseInt(document.getElementById('personen').value);if(uhrzeit.includes('geschlossen')) {err.innerText = '❌ An diesem Tag haben wir geschlossen!'; err.style.display = 'block'; return;}let belegt = 0;reservierungen.forEach(r => {if(r.datum === datum && r.bereich === bereich && r.uhrzeit === uhrzeit) { belegt += parseInt(r.personen); }});if((belegt + personen) > config.limits[bereich]) {err.innerText = ❌ Zu dieser Uhrzeit sind im ${bereich} leider keine Plätze mehr frei!; err.style.display = 'block'; return;}reservierungen.push({vorname: document.getElementById('vorname').value,nachname: document.getElementById('nachname').value,telefon: document.getElementById('telefon').value,email: document.getElementById('email').value,bereich: bereich, datum: datum, uhrzeit: uhrzeit, personen: personen,notizen: document.getElementById('notizen').value});save(); succ.style.display = 'block'; document.getElementById('resForm').reset(); initForm(); showDayList(datum);}
